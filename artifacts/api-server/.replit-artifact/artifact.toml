kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "npm run dev --workspace=@workspace/api-server"

[services.production]

[services.production.build]
args = ["npm", "run", "build", "--workspace=@workspace/api-server"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["sh", "-c", "php -S 0.0.0.0:${PORT} artifacts/codex-dynamics/public/api/index.php"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
