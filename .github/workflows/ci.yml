name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, openssl
          coverage: none
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: PHP syntax
        run: find artifacts/codex-dynamics/public/api -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm run test:api
      - run: npm run build
